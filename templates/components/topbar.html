<header
  class="topbar d-flex justify-content-between align-items-center mb-4 px-4 py-3 bg-white border-bottom shadow-sm"
>
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      class="form-control"
      placeholder="Buscar processo..."
    />
  </div>

  <div class="user-area d-flex align-items-center gap-3">
    <span class="text-muted fw-medium">{{ current_user.name }}</span>

    <a href="/" class="btn btn-outline-primary btn-sm fw-bold">
      &larr; Menu Principal
    </a>

    <div class="logout">
      <button
        id="btnLogout"
        type="button"
        class="btn btn-danger btn-sm fw-bold"
      >
        Sair
      </button>
    </div>
  </div>
</header>
