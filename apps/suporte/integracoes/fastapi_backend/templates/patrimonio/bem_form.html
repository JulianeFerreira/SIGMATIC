<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GAA Patrimônio - Novo Bem</title>
    <link rel="stylesheet" href="/static/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/static/img/logo_pcp.png" alt="Polícia Científica do Paraná" class="sidebar-logo-img">
            <div class="logo-text">
                <span class="app-title">Aplicativo GAA</span>
                <span class="app-subtitle">Polícia Científica do Paraná</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">Compras</a>
            <a href="/ui/contratos" class="nav-item {% if '/contratos' in request.url.path %}active{% endif %}">Contratos</a>
            <a href="/ui/patrimonio" class="nav-item {% if '/patrimonio' in request.url.path %}active{% endif %}">Patrimônio</a>
            <a href="/ui/planejamento" class="nav-item {% if '/planejamento' in request.url.path %}active{% endif %}">Planejamento</a>
            <a href="/ui/configuracoes" class="nav-item {% if '/configuracoes' in request.url.path %}active{% endif %}">Configurações</a>
        </nav>

        <div class="sidebar-footer">
            <span>GAA - v1.0</span>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="search-box">
                <input type="text" placeholder="Buscar bem..." disabled>
            </div>
        </header>

        <section class="page-header">
            <h1>Novo Bem</h1>
            <p>Cadastre um novo bem patrimonial (tombamento)</p>
        </section>

        <section class="tabs-nav">
            <a href="/ui/patrimonio" class="tab-item">Dashboard</a>
            <a href="/ui/patrimonio/bens" class="tab-item">Bens</a>
            <a href="/ui/patrimonio/bens/novo" class="tab-item active">Novo Bem</a>
            <a href="/ui/patrimonio/relatorios" class="tab-item">Relatórios</a>
        </section>

        <form id="bemForm">
            <!-- INFORMAÇÕES BÁSICAS -->
            <section class="card">
                <h2>Identificação</h2>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label class="field-label">Tombamento *</label>
                        <input name="tombamento" class="field-input" placeholder="Ex: PCP-000123" required>
                    </div>
                    <div class="form-field">
                        <label class="field-label">Situação *</label>
                        <select name="situacao" class="field-input" required>
                            <option value="em_uso">Em uso</option>
                            <option value="ocioso">Ocioso</option>
                            <option value="manutencao">Manutenção</option>
                            <option value="extraviado">Extraviado</option>
                            <option value="baixado">Baixado</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label">Descrição *</label>
                    <textarea name="descricao" class="field-textarea" placeholder="Descreva o bem (ex: Notebook Dell i5 16GB 512GB)..." required></textarea>
                </div>

                <div class="form-grid-3">
                    <div class="form-field">
                        <label class="field-label">Categoria</label>
                        <input name="categoria" class="field-input" placeholder="Ex: TI, Mobiliário, Laboratório">
                    </div>
                    <div class="form-field">
                        <label class="field-label">Marca</label>
                        <input name="marca" class="field-input" placeholder="Ex: Dell">
                    </div>
                    <div class="form-field">
                        <label class="field-label">Modelo</label>
                        <input name="modelo" class="field-input" placeholder="Ex: Latitude 5420">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label class="field-label">Serial</label>
                        <input name="serial" class="field-input" placeholder="Nº de série do equipamento">
                    </div>
                    <div class="form-field">
                        <label class="field-label">Garantia até</label>
                        <input type="date" name="garantia_fim" class="field-input">
                    </div>
                </div>
            </section>

            <!-- LOCALIZAÇÃO / RESPONSÁVEL -->
            <section class="card">
                <h2>Localização e Responsável</h2>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label class="field-label">Unidade atual</label>
                        <input name="unidade_atual" class="field-input" placeholder="Ex: UETC Curitiba Centro">
                    </div>
                    <div class="form-field">
                        <label class="field-label">Local físico</label>
                        <input name="local_fisico" class="field-input" placeholder="Ex: Sala 12 / Necropsia / Almoxarifado">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label class="field-label">Responsável (nome)</label>
                        <input name="responsavel_nome" class="field-input" placeholder="Nome do responsável pela carga">
                    </div>
                    <div class="form-field">
                        <label class="field-label">Responsável (matrícula)</label>
                        <input name="responsavel_matricula" class="field-input" placeholder="Matrícula do servidor">
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label">Observações</label>
                    <textarea name="observacoes" class="field-textarea" placeholder="Observações gerais do bem..."></textarea>
                </div>
            </section>

            <div class="form-actions">
                <button type="button" class="btn secondary" id="btnCancelarBem">Cancelar</button>
                <button type="submit" class="btn primary">Salvar Bem</button>
            </div>
        </form>
    </main>
</div>

<script>
    document.getElementById("btnCancelarBem").addEventListener("click", () => {
        window.location.href = "/ui/patrimonio/bens";
    });

    document.getElementById("bemForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const form = e.target;
        const payload = Object.fromEntries(new FormData(form).entries());

        const r = await fetch("/api/patrimonio/bens", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!r.ok) {
            alert(await r.text());
            return;
        }

        const d = await r.json();
        window.location.href = `/ui/patrimonio/bens/${encodeURIComponent(d.tombamento)}`;
    });
</script>
</body>
</html>
