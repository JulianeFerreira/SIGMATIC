{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo GAA - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">

    <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h4 fw-bold mb-1">Entrar</h1>
                    <p class="text-muted mb-0">Use seu usuário do Aplicativo GAA.</p>
                </div>

                <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                     style="width: 42px; height: 42px; background: #2563eb;">
                    G
                </div>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           required
                           autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           required
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>

            <div class="text-center text-muted small mt-3">
                Acesso restrito à equipe do Grupo Auxiliar Administrativo.
            </div>

            <div class="text-center small mt-3">
                <a href="/register/" class="text-decoration-none">Criar novo usuário</a>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            username: form.username.value,
            password: form.password.value
        };

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(data)
            });

            const result = await res.json();

            if (res.ok) {
                localStorage.setItem('token', result.access_token);
                window.location.href = '/';
            } else {
                alert("Erro: " + (result.detail || JSON.stringify(result)));
            }

        } catch (err) {
            console.error("Erro ao fazer login:", err);
            alert("Erro de comunicação com o servidor.");
        }
    });
</script>

</body>
</html>
